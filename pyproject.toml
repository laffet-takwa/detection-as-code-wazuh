[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelforge"
version = "0.1.0"
description = "Detection-as-Code Engineering Platform for Wazuh"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "SentinelForge Contributors"}]
keywords = [
    "detection-engineering",
    "sigma",
    "wazuh",
    "siem",
    "security",
    "mitre-attack",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.14,<3",
    "pyyaml>=6.0,<7",
    "pysigma>=1.5,<2",
    "sigma-cli>=3.1,<4",
    "click>=8.1,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<8",
    "pytest-cov>=4.1,<5",
    "ruff>=0.4,<1",
    "mypy>=1.9,<2",
    "pre-commit>=3.6,<4",
]

[project.entry-points]
console_scripts = { "sentinelforge" = "sentinelforge.cli:main" }

[tool.ruff]
target-version = "py312"
line-length = 120
select = ["E", "W", "F", "I", "UP", "B", "C4", "T20"]
ignore = []
per-file-ignores = { "tests/**/*" = ["T201", "S101"], "scripts/**/*" = ["T201"] }
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict = true
exclude = [
    "tests/**",
    ".venv/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sentinelforge*"]

[tool.coverage.run]
source = ["src/sentinelforge"]
omit = [
    "tests/**",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]