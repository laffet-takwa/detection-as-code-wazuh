name: SentinelForge Detection CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  validate-and-test:
    name: Validate, Convert, and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run Ruff linting
        run: |
          ruff check src/ tests/ scripts/

      - name: Run Ruff formatting check
        run: |
          ruff format --check src/ tests/ scripts/

      - name: Run mypy type checking
        run: |
          mypy src/sentinelforge

      - name: Validate Sigma rules
        run: |
          sentinelforge validate

      - name: Convert rules to Wazuh
        run: |
          sentinelforge convert --backend wazuh

      - name: Run fixture tests
        run: |
          sentinelforge test --fixtures tests/fixtures

      - name: Generate reports
        run: |
          sentinelforge report

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinelforge-reports
          path: reports/
          retention-days: 30

      - name: Upload generated rules
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinelforge-wazuh-rules
          path: wazuh/rules/
          retention-days: 30

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: validate-and-test
    if: always()
    steps:
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          name: sentinelforge-reports
          path: reports/

      - name: Display coverage summary
        run: |
          if [ -f reports/report.md ]; then
            cat reports/report.md
          else
            echo "No report found"
          fi

  integration-test:
    name: Wazuh Integration Test (Manual)
    runs-on: ubuntu-latest
    if: false
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Install Wazuh Manager (for integration testing)
        run: |
          # This is a placeholder for actual Wazuh installation
          # In a real integration environment, you would:
          # 1. Install Wazuh Manager
          # 2. Configure decoders and rules
          # 3. Start the manager
          echo "Wazuh integration test environment setup required"
          echo "This workflow must be run in a dedicated lab environment"
          exit 0

      - name: Run validation and conversion
        run: |
          sentinelforge validate
          sentinelforge convert --backend wazuh

      - name: Run integration tests
        env:
          SENTINELFORGE_WAZUH_LOGTEST: /var/ossec/bin/wazuh-logtest
        run: |
          sentinelforge test --fixtures tests/fixtures --wazuh

      - name: Generate integration reports
        run: |
          sentinelforge report

      - name: Upload integration reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinelforge-integration-reports
          path: reports/
          retention-days: 30